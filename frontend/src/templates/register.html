<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletFlow | Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
    <script src="https://kit.fontawesome.com/e938297d46.js" crossorigin="anonymous"></script>
</head>

<body class="auth-page">
    <main class="auth-card"><a class="auth-brand" href="/"><span class="logo-icon"><i
                    class="fa-solid fa-wallet"></i></span><span class="logo-name">WalletFlow</span></a>
        <h1>Crie sua conta</h1>
        <p>Preencha os dados que serão enviados à sua rota de cadastro.</p>
        <form data-form-event="auth:register">
            <div class="field"><label for="register-name">Nome</label><input id="register-name" name="name"
                    autocomplete="name" required></div>
            <div class="field auth-field"><label for="register-email">E-mail</label><input id="register-email"
                    name="email" type="email" autocomplete="email" required></div>
            <div class="field auth-field"><label for="register-password">Senha</label><input id="register-password"
                    name="password" type="password" autocomplete="new-password" required></div>
            <div class="field auth-field"><label for="register-password-confirmation">Confirmar senha</label><input
                    id="register-password-confirmation" name="password_confirmation" type="password"
                    autocomplete="new-password" required></div>
            <div class="form-actions"><button class="button primary" type="submit">Criar conta</button></div>
        </form>
        <p class="auth-footer">Já possui uma conta? <a href="/login">Entrar</a></p>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>

</html>
