<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletFlow | Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="auth-container">
        <div class="brand">
            <h1 class="brand-title">WalletFlow</h1>
            <p class="brand-subtitle">Acesse sua conta</p>
        </div>

        <form id="loginFormElement" novalidate>
            <div class="success-message" id="loginSuccess">
                ✓ Login realizado com sucesso!
            </div>

            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" class="form-control" id="loginEmail" name="email" placeholder="seu@email.com"
                    required>
                <div class="error-message" id="loginEmailError">Email inválido</div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Senha</label>
                <input type="password" class="form-control" id="loginPassword" name="password" placeholder="••••••••"
                    required>
                <div class="error-message" id="loginPasswordError">Senha obrigatória</div>
            </div>

            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <div class="form-footer">
            <a href="#" id="forgotPasswordLink">Esqueci minha senha</a>
        </div>

        <div class="form-link">
            Não tem conta? <a href="/register">Criar conta</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
