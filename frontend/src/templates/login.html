<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletFlow | Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="https://kit.fontawesome.com/e938297d46.js" crossorigin="anonymous"></script>
</head>

<body class="auth-page">
    <main class="auth-card"><a class="auth-brand" href="/"><span class="logo-icon"><i
                    class="fa-solid fa-wallet"></i></span><span class="logo-name">WalletFlow</span></a>
        <h1>Acesse sua conta</h1>
        <p>Informe suas credenciais para continuar.</p>
        <form id="FormLogin" data-form-event="auth:login">
            <div class="field"><label for="login-email">E-mail</label><input id="login-email" name="email" type="email"
                    autocomplete="email" required></div>
            <div class="field auth-field"><label for="login-password">Senha</label><input id="login-password"
                    name="password" type="password" autocomplete="current-password" required></div>
            <p class="forgot-password"><a href="/support#faq">Esqueceu sua senha?</a></p>
            <div class="form-actions"><button class="button primary" type="submit">Entrar</button></div>
        </form>
        <p class="auth-footer">Ainda não possui uma conta? <a href="/register">Cadastre-se</a></p>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
